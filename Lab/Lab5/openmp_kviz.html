<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMP Kviz – Paralelno Programiranje</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --card:     #20243a;
    --border:   #2e3348;
    --accent:   #6c63ff;
    --accent2:  #00d4aa;
    --danger:   #ff4757;
    --warn:     #ffa502;
    --text:     #e8eaf0;
    --muted:    #8890aa;
    --code-bg:  #141720;
    --correct:  #00d4aa;
    --wrong:    #ff4757;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #0f1117 0%, #1a1d27 50%, #12162a 100%);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 1.5rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 50% -20%, rgba(108,99,255,.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(108,99,255,.12);
    border: 1px solid rgba(108,99,255,.3);
    padding: .3rem .8rem;
    border-radius: 4px;
    margin-bottom: 1rem;
  }
  header h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: .5rem;
  }
  header p {
    color: var(--muted);
    font-size: .95rem;
    max-width: 500px;
    margin: 0 auto;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .progress-bar-track {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width .4s ease;
    width: 0%;
  }
  .progress-label {
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── MAIN ── */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.25rem 5rem;
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    margin-bottom: 1.5rem;
    transition: border-color .2s;
    position: relative;
  }
  .question-card.answered-correct { border-color: var(--correct); }
  .question-card.answered-wrong   { border-color: var(--wrong); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .q-number {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--accent);
    background: rgba(108,99,255,.12);
    border: 1px solid rgba(108,99,255,.25);
    border-radius: 4px;
    padding: .25rem .55rem;
    white-space: nowrap;
    margin-top: .1rem;
  }
  .q-text {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  /* ── CODE BLOCK ── */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
    font-family: var(--mono);
    font-size: .82rem;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
    color: #c8d3f5;
  }
  .code-block .kw  { color: #bb80b3; }
  .code-block .pp  { color: #6c9ef8; }
  .code-block .num { color: #f7c948; }
  .code-block .cm  { color: #636d8a; font-style: italic; }
  .code-block .fn  { color: #00d4aa; }

  /* ── IMAGE SLOT ── */
  .img-slot {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    text-align: center;
    margin: .75rem 0;
    color: var(--muted);
    font-size: .8rem;
    font-family: var(--mono);
  }
  .img-slot img { max-width: 100%; border-radius: 6px; display: block; margin: 0 auto; }

  /* ── OPTIONS ── */
  .options { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: .75rem;
    padding: .85rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
    background: var(--surface);
    user-select: none;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(108,99,255,.07);
  }
  .option.selected  { border-color: var(--accent); background: rgba(108,99,255,.12); }
  .option.correct   { border-color: var(--correct); background: rgba(0,212,170,.1); }
  .option.wrong     { border-color: var(--wrong);   background: rgba(255,71,87,.1); }
  .option.disabled  { cursor: default; }
  .option.reveal-correct { border-color: var(--correct); background: rgba(0,212,170,.07); }

  .opt-radio {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .option.selected  .opt-radio { border-color: var(--accent); background: var(--accent); }
  .option.correct   .opt-radio { border-color: var(--correct); background: var(--correct); }
  .option.wrong     .opt-radio { border-color: var(--wrong);   background: var(--wrong); }
  .option.reveal-correct .opt-radio { border-color: var(--correct); }

  .opt-radio::after {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    display: none;
  }
  .option.selected .opt-radio::after,
  .option.correct  .opt-radio::after,
  .option.wrong    .opt-radio::after { display: block; }

  .opt-label { font-size: .93rem; color: var(--text); }
  .opt-icon  { margin-left: auto; font-size: 1.1rem; }

  /* ── EXPLANATION ── */
  .explanation {
    display: none;
    margin-top: 1rem;
    padding: .9rem 1.1rem;
    border-radius: 8px;
    font-size: .88rem;
    line-height: 1.6;
    border-left: 3px solid;
  }
  .explanation.show { display: block; }
  .explanation.correct-exp { background: rgba(0,212,170,.08); border-color: var(--correct); color: #7eefd7; }
  .explanation.wrong-exp   { background: rgba(255,71,87,.08); border-color: var(--wrong);   color: #ff8a95; }

  
  .btn-check {
    margin-top: 1rem;
    padding: .6rem 1rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: .88rem;
  }
  .btn-check:hover { border-color: var(--accent); }


  /* ── SECTION DIVIDER ── */
  .section-divider {
    display: flex; align-items: center; gap: 1rem;
    margin: 2.5rem 0 1.5rem;
  }
  .section-divider span {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent2);
    white-space: nowrap;
  }
  .section-divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }

  /* ── SUBMIT BUTTON ── */
  .btn-submit {
    display: block;
    width: 100%;
    max-width: 380px;
    margin: 2.5rem auto 0;
    padding: 1rem 2rem;
    background: linear-gradient(135deg, var(--accent), #9b8fff);
    color: #fff;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: .01em;
    transition: opacity .2s, transform .15s;
    box-shadow: 0 4px 20px rgba(108,99,255,.35);
  }
  .btn-submit:hover { opacity: .9; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }

  /* ── RESULTS PANEL ── */
  #results-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    margin: 2rem 0;
    text-align: center;
  }
  #results-panel.show { display: block; }
  .results-score {
    font-size: 4rem;
    font-weight: 700;
    font-family: var(--mono);
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: .5rem;
  }
  .results-label { color: var(--muted); font-size: .95rem; margin-bottom: 1.5rem; }
  .results-breakdown {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .rb-item { text-align: center; }
  .rb-num  { font-size: 1.8rem; font-weight: 700; font-family: var(--mono); }
  .rb-txt  { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .rb-correct .rb-num { color: var(--correct); }
  .rb-wrong   .rb-num { color: var(--wrong); }
  .btn-retry {
    display: inline-block;
    padding: .75rem 2rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    transition: border-color .15s;
  }
  .btn-retry:hover { border-color: var(--accent); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .question-card { padding: 1.25rem; }
    .code-block { font-size: .75rem; }
    header { padding: 2rem 1rem 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-tag">#pragma omp parallel</div>
  <h1>OpenMP Kviz</h1>
  <p>Paralelno programiranje – Lab 5 &nbsp;|&nbsp; Proveri svoje znanje o OpenMP direktivama i klauzulama</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>
  <div class="progress-label" id="progress-label">0 / 0</div>
</div>

<main>
  <div id="quiz-container"></div>
  <button class="btn-submit" id="btn-submit" onclick="submitQuiz()">Predaj kviz</button>
  <div id="results-panel">
    <div class="results-score" id="score-pct"></div>
    <div class="results-label" id="score-text"></div>
    <div class="results-breakdown">
      <div class="rb-item rb-correct"><div class="rb-num" id="r-correct">0</div><div class="rb-txt">Tačno</div></div>
      <div class="rb-item rb-wrong">  <div class="rb-num" id="r-wrong">0</div>  <div class="rb-txt">Netačno</div></div>
      <div class="rb-item"><div class="rb-num" id="r-total" style="color:var(--text)">0</div><div class="rb-txt">Ukupno</div></div>
    </div>
    <button class="btn-retry" onclick="retryQuiz()">↺ Pokušaj ponovo</button>
  </div>
</main>

<script>
// ──────────────────────────────────────────────────────────────
//  PITANJA
//  Za pitanja koja imaju slike: dodaj src u polje "img" kao
//  relativnu putanju ili URL, npr. img: "slike/q1.png"
//  Polje "img" možeš ostaviti null ako slika nije potrebna.
// ──────────────────────────────────────────────────────────────
const questions = [

  // ══════════ SEKCIJA 1: Osnove direktiva ══════════
  {
    section: "Osnove OpenMP direktiva",
    text: "Direktiva <code>critical</code>:",
    code: null, img: null,
    options: [
      "vraća grešku ukoliko više linija pristupaju naredbi",
      "preskače izvršenje sledeće naredbe",
      "dozvoljava jednoj niti da pristupi naredbi koja sledi",
      "postavlja prioritet sledećoj naredbi"
    ],
    correct: 2,
    explanation: "<b>critical</b> sekcija osigurava da samo <em>jedna nit u jednom trenutku</em> izvršava kritični blok koda. Ostale niti čekaju dok prva nit ne izađe iz sekcije."
  },
  {
    section: null,
    text: "Direktiva <code>barrier</code>:",
    code: null, img: null,
    options: [
      "zaustavlja izvršenje dok sve niti ne izvrše deo koda ispred direktive",
      "(prazna opcija)",
      "sprečava izvršenje sledeće naredbe, dok bar jedna nit ne izvrši naredbu",
      "zaustavlja izvršenje paralelnog bloka i prelazi na sekvencijalni kod"
    ],
    correct: 0,
    explanation: "<b>barrier</b> je tačka sinhronizacije – sve niti moraju stići do nje pre nego što ijedna od njih nastavi dalje."
  },
  {
    section: null,
    text: "Odredba <code>nowait</code>:",
    code: null, img: null,
    options: [
      "ne čeka izvršenje trenutne naredbe, već prelazi na sledeću",
      "se oslobađa barijere koja je postavljena nakon trenutnog bloka",
      "se oslobađa barijere koja je postavljena nakon prethodnog bloka",
      "postavlja veći prioritet naredbama koje slede"
    ],
    correct: 1,
    explanation: "<b>nowait</b> ukida implicitnu barijeru na kraju <code>for</code> ili <code>single</code> konstrukta, pa nit može nastaviti bez čekanja ostalih."
  },
  {
    section: null,
    text: "Nakon završetka paralelnog regiona:",
    code: null, img: null,
    options: [
      "(prazno)",
      "nastavlja se sa izvršenjem sekvencijalnog dela programa",
      "postavlja se barijera koja čeka da sve niti završe izvršenje koda u paralelnom regionu",
      "sekvencijalni deo programa nastavlja sa izvršenjem, a rezultati iz niti se obrađuju po pristizanju"
    ],
    correct: 2,
    explanation: "Na kraju paralelnog regiona postoji <em>implicitna barijera</em> – sve niti moraju završiti pre nego što master nit nastavi sekvencijalni deo."
  },

  // ══════════ SEKCIJA 2: Klauzule privatnosti ══════════
  {
    section: "Klauzule privatnosti",
    text: "Sve promenjive definisane <b>van</b> paralelnog bloka su:",
    code: null, img: null,
    options: ["private", "lastprivate", "firstprivate", "shared"],
    correct: 3,
    explanation: "Podrazumevano, promenjive definisane van paralelnog bloka su <b>shared</b> – sve niti pristupaju istoj memorijskoj lokaciji."
  },
  {
    section: null,
    text: "Odredba <code>firstprivate</code>:",
    code: null, img: null,
    options: [
      "se ponaša isto kao i private odredba",
      "se ponaša slično private odredbi, uz izmenu da se promeniva inicijalizuje starom vrednošću na ulazu u paralelni blok",
      "se ponaša slično private odredbi, osim što se vrednost iz paralelnog bloka upisuje u promenjivanu na kraju izvršenja paralelnog bloka",
      "se ponaša kao private ključna reč u C-u"
    ],
    correct: 1,
    explanation: "<b>firstprivate</b> kreira privatnu kopiju za svaku nit, ali je <em>inicijalizuje vrednošću</em> koju promenljiva ima pre ulaska u paralelni blok."
  },
  {
    section: null,
    text: "Odredba <code>lastprivate</code>:",
    code: null, img: null,
    options: [
      "se ponaša slično private odredbi, uz izmenu da se promeniva inicijalizuje starom vrednošću na ulazu u paralelni blok",
      "se ponaša isto kao i private odredba",
      "se ponaša slično private odredbi, osim što se vrednost iz paralelnog bloka upisuje u promenjivanu na kraju izvršenja paralelnog bloka",
      "se ponaša kao private ključna reč u C-u"
    ],
    correct: 2,
    explanation: "<b>lastprivate</b> kreira privatnu kopiju, a na kraju paralelnog bloka <em>vrednost iz poslednje iteracije</em> (ili poslednjeg zadatka) upisuje se nazad u originalnu promenljivu."
  },
  {
    section: null,
    text: "Odredba <code>reduction(op:variable)</code>:",
    code: null, img: null,
    options: [
      "postavlja vrednost promenjivoj (variable) u zavisnosti od operacije (op)",
      "postavlja vrednost promenjivoj (variable) na 0",
      "postavlja vrednost promenjivoj (variable) iz promenjive definisane van paralelnog bloka",
      "(prazno)"
    ],
    correct: 0,
    explanation: "<b>reduction</b> kreira privatne kopije za svaku nit, a na kraju kombinuje rezultate koristeći zadatu operaciju (npr. +, *, min, max) u originalnu promenljivu."
  },

  // ══════════ SEKCIJA 3: Zadaci sa kodom – single/barrier ══════════
  {
    section: "Analiza koda – sinhronizacija",
    text: "Koja od datih tvrdnji je tačna, ako se posmatra OpenMP primer u nastavku?",
    code: `#pragma omp parallel
{
    do_something();
    #pragma omp single
    do_something_else();
}`,
    img: null,
    options: [
      "Funkciju do_something_else() izvršiće sve niti",
      "Funkciju do_something_else() izvršiće samo jedna nit, ali nije unapred poznato koja je to nit",
      "Funkciju do_something_else() preskočiće sve niti osim one sa indeksom 1",
      "Funkciju do_something_else() izvršiće samo nit sa identifikatorom 0"
    ],
    correct: 1,
    explanation: "<b>single</b> konstrukt garantuje da blok izvršava <em>samo jedna</em> nit – ali OpenMP ne specificira koja (nije nužno master/nit 0)."
  },
  {
    section: null,
    text: "Da li će nakon izvršenog paralelnog bloka da bude odštampano <b>24</b>?",
    code: `int i = 1;
#pragma omp parallel for private(m)
for (m = 2; m < 5; m++)
{
    #pragma omp barrier
    i *= m;
}
printf("%d", &i);`,
    img: null,
    options: ["a. Ne.", "b. Da."],
    correct: 1,
    explanation: "Svaka nit ima privatnu kopiju <code>m</code>, ali <code>i</code> je <b>shared</b>. Pošto sve niti modifikuju <code>i</code> (2×3×4=24) uz barijeru unutar petlje, rezultat je 24."
  },
  {
    section: null,
    text: "Da li će nakon izvršenog paralelnog bloka da bude odštampano <b>5</b>?",
    code: `int i = 1;
#pragma omp parallel for lastprivate(i) private(m)
for (m = 2; m < 5; m++)
{
    #pragma omp barrier
    i = m;
}
printf("%d", i);`,
    img: null,
    options: ["a. Ne.", "b. Da."],
    correct: 0,
    explanation: "Sa <b>lastprivate(i)</b>, vrednost <code>i</code> nakon petlje odgovara poslednjoj iteraciji. Poslednja iteracija je <code>m=4</code>, pa je <code>i=4</code>, ne 5."
  },
  {
    section: null,
    text: "Da li će nakon izvršenog paralelnog bloka da bude odštampano <b>45</b>?",
    code: `int i = 1;
#pragma omp parallel for private(i, m)
for (m = 1; m < 10; m++)
{
    #pragma omp critical
    i *= m;
}
printf("%d", &i);`,
    img: null,
    options: ["a. Da.", "b. Ne."],
    correct: 1,
    explanation: "<code>i</code> je deklarisana kao <b>private</b> – svaka nit ima svoju kopiju inicijalizovanu na neodređenu vrednost (ne na 1). Vrednost van paralelnog bloka ostaje <code>i=1</code>. Neće biti 45."
  },
  {
    section: null,
    text: "Da li će nakon izvršenog paralelnog bloka da bude odštampano <b>45</b>?",
    code: `int i = 0;
#pragma omp parallel for private(m)
for (m = 0; m < 10; m++)
{
    #pragma omp critical
    i += m;
}
printf("%d", i);`,
    img: null,
    options: ["a. Ne.", "b. Da."],
    correct: 1,
    explanation: "<code>i</code> je <b>shared</b>, a <code>critical</code> sprečava race condition. Svaka nit dodaje svoju vrednost m (0+1+2+...+9 = 45). Rezultat je 45."
  },

  // ══════════ SEKCIJA 4: Reduction zadaci ══════════
  {
    section: "Reduction klauzula – izračunavanja",
    text: "Šta će od ponuđenog sledeći OpenMP kod prikazati?<br><small>int t = 2; omp_set_num_threads(4); reduction(+:t); { t += 3; }</small>",
    code: `int t = 2;

// ──────────────────────────────────────────────────────────────
//  STATE
// ──────────────────────────────────────────────────────────────
let userAnswers = new Array(questions.length).fill(null);
let submitted   = false;

// ──────────────────────────────────────────────────────────────
//  BUILD UI
// ──────────────────────────────────────────────────────────────
function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  let lastSection = null;

  questions.forEach((q, qi) => {
    // Section divider
    if (q.section && q.section !== lastSection) {
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.innerHTML = `<hr><span>${q.section}</span><hr>`;
      container.appendChild(div);
      lastSection = q.section;
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${qi}`;

    // Header
    let codeHTML = '';
    if (q.code) {
      codeHTML = `<div class="code-block">${escCode(q.code)}</div>`;
    }

    let imgHTML = '';
    if (q.img) {
      imgHTML = `<div class="img-slot"><img src="${q.img}" alt="Slika za pitanje ${qi+1}"></div>`;
    }

    // Options
    const optsHTML = q.options.map((opt, oi) => `
      <div class="option" id="q${qi}-opt${oi}" onclick="selectOption(${qi}, ${oi})">
        <div class="opt-radio"></div>
        <div class="opt-label">${opt}</div>
        <div class="opt-icon" id="q${qi}-icon${oi}"></div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-number">Q${String(qi+1).padStart(2,'0')}</div>
        <div class="q-text">${q.text}</div>
      </div>
      ${codeHTML}${imgHTML}
      <div class="options" id="opts-${qi}">${optsHTML}</div>
      <button class="btn-check" onclick="checkQuestion(${qi})">Proveri odgovor</button>
      <div class="explanation" id="exp-${qi}"></div>
    `;

    container.appendChild(card);
  });

  updateProgress();
}

function escCode(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ──────────────────────────────────────────────────────────────
//  INTERACTION
// ──────────────────────────────────────────────────────────────
function selectOption(qi, oi) {
  if (submitted) return;
  if (userAnswers[qi] !== null) {
    // deselect previous
    const prev = document.getElementById(`q${qi}-opt${userAnswers[qi]}`);
    if (prev) prev.classList.remove('selected');
  }
  userAnswers[qi] = oi;
  document.getElementById(`q${qi}-opt${oi}`).classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = questions.length ? (answered / questions.length * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${answered} / ${questions.length}`;
}


// Provera pojedinačnog pitanja
function checkQuestion(qi) {
  const chosen = userAnswers[qi];
  if (chosen === null) {
    alert('Prvo izaberi odgovor.');
    return;
  }

  const q = questions[qi];
  const card = document.getElementById(`q-card-${qi}`);
  const expEl = document.getElementById(`exp-${qi}`);

  // Ako je već provereno, ne radi ništa
  if (card.classList.contains('answered-correct') ||
      card.classList.contains('answered-wrong')) return;

  const isCorrect = chosen === q.correct;

  for (let oi = 0; oi < q.options.length; oi++) {
    const optEl = document.getElementById(`q${qi}-opt${oi}`);
    const icon  = document.getElementById(`q${qi}-icon${oi}`);

    if (oi === q.correct && chosen !== q.correct) {
      optEl.classList.add('reveal-correct');
      icon.textContent = '✓';
    }
    if (oi === chosen) {
      if (isCorrect) {
        optEl.classList.add('correct');
        icon.textContent = '✓';
      } else {
        optEl.classList.add('wrong');
        icon.textContent = '✗';
      }
    }
    optEl.classList.add('disabled');
  }

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  expEl.innerHTML = q.explanation;
  expEl.classList.add('show');
  expEl.classList.add(isCorrect ? 'correct-exp' : 'wrong-exp');
}

// ──────────────────────────────────────────────────────────────
//  SUBMIT
// ──────────────────────────────────────────────────────────────
function submitQuiz() {
  if (submitted) return;
  const unanswered = userAnswers.filter(a => a === null).length;
  if (unanswered > 0) {
    if (!confirm(`Nisi odgovorio na ${unanswered} pitanje(a). Ipak predaj?`)) return;
  }
  submitted = true;
  document.getElementById('btn-submit').style.display = 'none';

  let correct = 0, wrong = 0;

  questions.forEach((q, qi) => {
    const card   = document.getElementById(`q-card-${qi}`);
    const expEl  = document.getElementById(`exp-${qi}`);
    const chosen = userAnswers[qi];
    const right  = q.correct;
    const isCorrect = chosen === right;

    if (chosen !== null) isCorrect ? correct++ : wrong++;

    // Style options
    for (let oi = 0; oi < q.options.length; oi++) {
      const optEl = document.getElementById(`q${qi}-opt${oi}`);
      const icon  = document.getElementById(`q${qi}-icon${oi}`);
      optEl.classList.add('disabled');
      if (oi === right && chosen !== right) {
        optEl.classList.add('reveal-correct');
        icon.textContent = '✓';
      }
      if (oi === chosen) {
        if (isCorrect) { optEl.classList.add('correct'); icon.textContent = '✓'; }
        else           { optEl.classList.add('wrong');   icon.textContent = '✗'; }
      }
    }

    // Card border
    if (chosen !== null) {
      card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
    }

    // Explanation
    if (q.explanation) {
      expEl.innerHTML = q.explanation;
      expEl.classList.add('show');
      expEl.classList.add(isCorrect ? 'correct-exp' : 'wrong-exp');
    }
  });

  // Results
  const total = questions.length;
  const pct   = Math.round(correct / total * 100);
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-text').textContent =
    pct >= 90 ? '🏆 Odlično! Savladao si OpenMP!' :
    pct >= 70 ? '👍 Dobro! Malo više vežbe i biće super.' :
    pct >= 50 ? '📖 Prođi još jednom kroz materijal.' :
                '💡 Proučavaj OpenMP direktivno – može biti!';
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent   = wrong;
  document.getElementById('r-total').textContent   = total;

  const resultsPanel = document.getElementById('results-panel');
  resultsPanel.classList.add('show');
  resultsPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Final progress 100%
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = `${total} / ${total}`;
}

// ──────────────────────────────────────────────────────────────
//  RETRY
// ──────────────────────────────────────────────────────────────
function retryQuiz() {
  userAnswers = new Array(questions.length).fill(null);
  submitted   = false;
  document.getElementById('results-panel').classList.remove('show');
  document.getElementById('btn-submit').style.display = '';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ──────────────────────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────────────────────
buildQuiz();
</script>
